name: Restore ccache
description: >-
  Restore the newest matching ccache snapshot and record when the job started using it,
  so ccache-save can keep only the entries this job touched.

inputs:
  path:
    description: ccache directory.
    required: true
  key:
    description: Exact key saved by this job for the current ref and commit.
    required: true
  restore-keys:
    description: Ordered fallback key prefixes.
    required: true

runs:
  using: composite
  steps:
    - name: Restore ccache snapshot
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}

    # 恢复的文件保留保存时的 mtime；ccache 每次命中都会刷新条目的 mtime，未命中则写入新文件，
    # 因此比此标记更新的文件即为本作业的工作集。
    - name: Mark ccache working-set start
      shell: bash
      run: echo "CCACHE_WORKING_SET_START=$(date +%s)" >> "${GITHUB_ENV}"
