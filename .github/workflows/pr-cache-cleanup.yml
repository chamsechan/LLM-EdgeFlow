name: PR Cache Cleanup

# PR 缓存只能被该 PR 访问。PR 关闭后即删除，
# 避免占用仓库 Actions 缓存配额而把 main 快照挤出去。
on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  delete-pr-caches:
    name: Delete Closed PR Caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Delete Caches Scoped to the Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -uo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/caches"
          if ! entries=$(gh api -X GET "${api}" -f ref="${CACHE_REF}" -f per_page=100 \
              --jq '.actions_caches[] | "\(.id) \(.key)"'); then
            echo "::warning::Cannot list caches for ${CACHE_REF}."
            exit 0
          fi
          while read -r id key; do
            [[ -z "${id}" ]] && continue
            if gh api -X DELETE "${api}/${id}" >/dev/null; then
              echo "Deleted ${key}"
            else
              echo "::warning::Cannot delete ${key}; read-only tokens skip cleanup."
            fi
          done <<< "${entries}"
