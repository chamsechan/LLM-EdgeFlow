name: LLM-EdgeFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & GTest Regression Suite
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "500M"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang-format-18 \
            cmake \
            curl \
            default-jre-headless \
            mold \
            ninja-build \
            python3

      - name: Restore/Save CCache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Restore/Save Verified Dependency Archives
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-subbuild/*-populate-prefix/src/*.tar.gz
            build/_deps/*-subbuild/*-populate-prefix/src/*.tgz
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/*.cmake') }}

      - name: Run Unified Full Quality Gate with mold
        run: |
          ccache -z
          LLM_EDGEFLOW_LINKER=mold LLM_EDGEFLOW_JOBS=4 \
            ./scripts/run_all_tests.sh --full
          ccache -s
