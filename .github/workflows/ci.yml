name: LLM-EdgeFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & GTest Regression Suite
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "500M"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang-format-18 \
            cmake \
            curl \
            default-jre-headless \
            mold \
            ninja-build \
            python3

      - name: Restore/Save CCache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Run Unified Full Quality Gate with mold
        run: |
          ccache -z
          LLM_EDGEFLOW_LINKER=mold LLM_EDGEFLOW_JOBS=4 \
            ./scripts/run_all_tests.sh
          ccache -s

  sanitizer:
    name: Production Backends ASan & UBSan
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/build/.ccache-sanitizers
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            curl \
            default-jre-headless \
            mold \
            ninja-build \
            python3

      - name: Restore/Save Sanitizer CCache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: sanitizer-ccache-v1-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            sanitizer-ccache-v1-${{ runner.os }}-${{ github.ref }}-
            sanitizer-ccache-v1-${{ runner.os }}-

      - name: Run Full Sanitizer Suite
        run: |
          LLM_EDGEFLOW_LINKER=mold LLM_EDGEFLOW_SANITIZERS=address,undefined \
            ./scripts/run_sanitizers.sh --full

  real-c-abi-and-profile:
    name: Real GGUF C ABI & Profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            curl \
            mold \
            ninja-build \
            python3

      - name: Cache Pinned GGUF
        uses: actions/cache@v4
        with:
          path: models/qwen2.5-0.5b-instruct-q4_k_m.gguf
          key: qwen2.5-0.5b-q4-k-m-74a4da8c9fdb

      - name: Fetch and Verify Pinned GGUF
        run: ./scripts/fetch_real_test_models.sh --gguf-only

      - name: Run Real C ABI and Public Profile
        run: LLM_EDGEFLOW_LINKER=mold ./scripts/run_real_model_e2e.sh

  kite-llm:
    name: kiteLLM Private Release & Real GGUF
    # Fork PRs and Dependabot do not receive repository secrets. Keep this job
    # on trusted events; do not switch it to pull_request_target.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            default-jre-headless \
            gh \
            libgomp1 \
            mold \
            ninja-build \
            python3

      # Only the public model artifacts are cached. Private kiteLLM headers, libraries and
      # linked executables must not enter this public repository's caches/artifacts.
      - name: Cache Pinned Kite Demo Models
        uses: actions/cache@v4
        with:
          path: |
            models/qwen2.5-0.5b-instruct-q4_k_m.gguf
            models/SmolVLM-256M-Instruct-Q8_0.gguf
            models/mmproj-SmolVLM-256M-Instruct-Q8_0.gguf
            models/bge_base_zh_v1.5.onnx
            models/bge_base_zh_v1.5_vocab.txt
            models/ms_marco_tinybert_l2_v2_quantized.onnx
            models/ms_marco_bert_vocab.txt
          key: kite-demo-models-${{ hashFiles('scripts/fetch_real_test_models.sh') }}

      - name: Fetch and Verify Pinned Text and Vision Models
        run: ./scripts/fetch_real_test_models.sh --kite

      - name: Download Verified Private Release and Configure kiteLLM
        env:
          GH_TOKEN: ${{ secrets.KITELLM_GITHUB_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Set KITELLM_GITHUB_TOKEN with read access to chamsechan/kiteLLM."
            exit 1
          fi
          cmake -S . -B build-kite -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLM_EDGEFLOW_LINKER=mold \
            -DENABLE_KITELLM=ON \
            -DENABLE_LLAMACPP=OFF \
            -DENABLE_ONNXRUNTIME=ON

      - name: Build kiteLLM SDK and Tests
        run: cmake --build build-kite -j4

      - name: Verify Backend Registration and Real Model Tests
        env:
          LLM_EDGEFLOW_TEST_KITELLM_DEMOS: "1"
          LLM_EDGEFLOW_TEST_KITELLM_VISION_MODEL: ${{ github.workspace }}/models/SmolVLM-256M-Instruct-Q8_0.gguf
          LLM_EDGEFLOW_TEST_KITELLM_VISION_CONFIG: kite_vision_run.json
          LLM_EDGEFLOW_TEST_KITELLM_MODEL: ${{ github.workspace }}/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
        run: |
          test -s "${LLM_EDGEFLOW_TEST_KITELLM_MODEL}"
          ./build-kite/alg_pipeline_tool catalog > build-kite/catalog.json
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          with open("build-kite/catalog.json", encoding="utf-8") as stream:
              catalog = json.load(stream)
          backends = {entry["backend_type"] for entry in catalog["backends"]}
          assert "kite_llm" in backends, "kiteLLM must be registered"
          assert "llama_cpp" not in backends, "Conflicting llama.cpp backend is enabled"
          kite = next(b for b in catalog["backends"] if b["backend_type"] == "kite_llm")
          assert "image_text_generation" in kite["supported_protocols"]
          assert "generated_token_embedding" in kite["supported_protocols"]
          assert any(m["model_type"] == "generated_text_embedding" for m in catalog["models"])
          assert any(m["model_type"] == "vision_document" for m in catalog["models"])
          for config in pathlib.Path("configs/kite").glob("*.json"):
              for command in ("validate", "plan"):
                  subprocess.run(["./build-kite/alg_pipeline_tool", command, str(config)], check=True)
          PY
          ctest --test-dir build-kite -j4 --output-on-failure

  acceptance-evidence:
    name: Exact-SHA Acceptance Evidence
    if: always()
    needs: [build-and-test, sanitizer, real-c-abi-and-profile, kite-llm]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Project Quality Evidence
        env:
          KITELLM_GATE_RESULT: ${{ needs.kite-llm.result }}
        run: |
          git fetch origin main --quiet
          ./scripts/generate_acceptance_evidence.sh \
            build/acceptance/project-quality-gate.json \
            "${{ needs.build-and-test.result }}" \
            "${{ needs.sanitizer.result }}" \
            "${{ needs.real-c-abi-and-profile.result }}" \
            project-quality-gate

      - name: Upload Project Quality Evidence
        uses: actions/upload-artifact@v4
        with:
          name: project-quality-acceptance-${{ github.sha }}
          path: build/acceptance/project-quality-gate.json

      - name: Enforce Required Job Results
        if: >-
          needs.build-and-test.result != 'success' ||
          needs.sanitizer.result != 'success' ||
          needs.real-c-abi-and-profile.result != 'success' ||
          (needs.kite-llm.result != 'success' && needs.kite-llm.result != 'skipped')
        run: exit 1
