name: LLM-EdgeFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & GTest Regression Suite
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "500M"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-format-18 python3 ccache

      - name: Restore/Save CCache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Verify Code Style (Google C++ Format)
        run: |
          ./scripts/format.sh --check
          git diff --check

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          ccache -z
          cmake .. -DCMAKE_BUILD_TYPE=Release -DLLM_EDGEFLOW_USE_CCACHE=ON

      - name: Compile Targets
        run: |
          cmake --build build --config Release -j4
          ccache -s

      - name: Run Google Test Suites via CTest
        run: |
          cd build
          export LD_LIBRARY_PATH=$PWD:$PWD/_deps/onnxruntime_prebuilt-src/lib:$LD_LIBRARY_PATH
          ctest --output-on-failure --verbose

      - name: Run End-to-End Multi-Modal Integration Demo
        run: |
          export LD_LIBRARY_PATH=$PWD/build:$PWD/build/_deps/onnxruntime_prebuilt-src/lib:$LD_LIBRARY_PATH
          ./build/alg_demo

      - name: Run Full 6-Tier Quality Assurance Script
        run: |
          export LD_LIBRARY_PATH=$PWD/build:$PWD/build/_deps/onnxruntime_prebuilt-src/lib:$LD_LIBRARY_PATH
          ./scripts/run_all_tests.sh
