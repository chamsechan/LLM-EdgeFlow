name: LLM-EdgeFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & GTest Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-format python3

      - name: Verify Code Style (Google C++ Format)
        run: |
          ./scripts/format.sh
          git diff --check || (echo "❌ Code style / whitespace check failed!" && exit 1)

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Compile Targets
        run: |
          cmake --build build --config Release -j4

      - name: Run Google Test Suites via CTest
        run: |
          cd build
          export LD_LIBRARY_PATH=$PWD:$PWD/_deps/onnxruntime_prebuilt-src/lib:$LD_LIBRARY_PATH
          ctest --output-on-failure --verbose

      - name: Run End-to-End Multi-Modal Integration Demo
        run: |
          export LD_LIBRARY_PATH=$PWD/build:$PWD/build/_deps/onnxruntime_prebuilt-src/lib:$LD_LIBRARY_PATH
          ./build/alg_demo

      - name: Run Full 6-Tier Quality Assurance Script
        run: |
          export LD_LIBRARY_PATH=$PWD/build:$PWD/build/_deps/onnxruntime_prebuilt-src/lib:$LD_LIBRARY_PATH
          ./scripts/run_all_tests.sh
