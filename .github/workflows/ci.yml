name: LLM-EdgeFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & GTest Regression Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-format python3 python3-pip

      - name: Verify Code Style (Google C++ Format)
        run: |
          ./scripts/format.sh
          git diff --exit-code || (echo "❌ Code style check failed! Please run ./scripts/format.sh" && exit 1)

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Compile Targets
        run: |
          cmake --build build --config Release -j4

      - name: Run Google Test Suites via CTest
        run: |
          cd build
          ctest --output-on-failure --verbose

      - name: Run End-to-End Multi-Modal Integration Demo
        run: |
          ./build/alg_demo

      - name: Run Full 6-Tier Quality Assurance Script
        run: |
          ./scripts/run_all_tests.sh
