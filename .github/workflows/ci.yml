name: LLM-EdgeFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & GTest Regression Suite (CMake 3.19)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # actions: write 允许 ccache-save 清理本 ref 已被取代的快照。
    permissions:
      contents: read
      actions: write

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "2G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # CMake 来自下方固定的 3.19 归档；Java 仅用于运行 PlantUML。
      - name: Set up Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          packages: >-
            build-essential ccache clang-format-18 curl default-jre-headless:java
            mold ninja-build:ninja python3 python3-jsonschema

      - name: Use Minimum Supported CMake
        run: |
          archive="${RUNNER_TEMP}/cmake-3.19.8-Linux-x86_64.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/Kitware/CMake/releases/download/v3.19.8/cmake-3.19.8-Linux-x86_64.tar.gz \
            --output "${archive}"
          echo "db0d7d225150dd6e08ce54995e671f9b4801b8e93e22df1eef52339f6bbbecd9  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/cmake-3.19.8-Linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Restore/Save 3rdparty Dependencies
        uses: actions/cache@v4
        with:
          path: |
            3rdparty/googletest
            3rdparty/pcre2
            3rdparty/llama_cpp
            3rdparty/onnxruntime
            3rdparty/nlohmann_json
            3rdparty/stb_image
          key: 3rdparty-release-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-${{ hashFiles('cmake_ext/*.cmake') }}
          restore-keys: |
            3rdparty-release-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-

      - name: Restore CCache
        uses: ./.github/actions/ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Run Unified Full Quality Gate with mold
        run: |
          ccache -z
          ./scripts/configure_build.sh "$PWD" "$PWD/build" dev-gate \
            -DPython3_EXECUTABLE=/usr/bin/python3 -DLLM_EDGEFLOW_LINKER=mold
          LLM_EDGEFLOW_LINKER=mold LLM_EDGEFLOW_JOBS=4 \
            ./scripts/run_all_tests.sh
          ccache -s

      - name: Save CCache
        uses: ./.github/actions/ccache-save
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          prefix: ccache-${{ runner.os }}-${{ github.ref }}-

  sanitizer:
    name: Production Backends ASan & UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # actions: write 允许 ccache-save 清理本 ref 已被取代的快照。
    permissions:
      contents: read
      actions: write

    env:
      CCACHE_DIR: ${{ github.workspace }}/build/.ccache-sanitizers
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "3G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # sanitizer-runtime 不包含需要 Java 的工具测试。
      - name: Set up Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          packages: build-essential ccache cmake curl mold ninja-build:ninja python3

      - name: Restore/Save Prebuilt 3rdparty Dependencies
        uses: actions/cache@v4
        with:
          path: |
            3rdparty/onnxruntime
            3rdparty/nlohmann_json
            3rdparty/stb_image
          key: 3rdparty-prebuilt-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-${{ hashFiles('cmake_ext/ThirdPartyEngines.cmake', 'cmake_ext/NlohmannJson.cmake', 'cmake_ext/StbImage.cmake') }}
          restore-keys: |
            3rdparty-prebuilt-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-

      - name: Restore Sanitizer CCache
        uses: ./.github/actions/ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          # 恢复最新的可访问快照；保存按 ref 和 commit sha 划分的新快照
          key: sanitizer-ccache-v2-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            sanitizer-ccache-v2-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-${{ github.ref }}-
            sanitizer-ccache-v2-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-

      - name: Run CI Runtime Sanitizer Suite
        run: |
          ccache -z
          LLM_EDGEFLOW_LINKER=mold LLM_EDGEFLOW_SANITIZERS=address,undefined \
            ./scripts/run_sanitizers.sh --ci-runtime
          ccache -s

      - name: Save Sanitizer CCache
        uses: ./.github/actions/ccache-save
        with:
          path: ${{ env.CCACHE_DIR }}
          key: sanitizer-ccache-v2-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-${{ github.ref }}-${{ github.sha }}
          prefix: sanitizer-ccache-v2-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-${{ github.ref }}-

  real-c-abi-and-profile:
    name: Real GGUF Operator & Profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write 允许 ccache-save 清理本 ref 已被取代的快照。
    permissions:
      contents: read
      actions: write

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "1G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          packages: build-essential ccache cmake curl mold ninja-build:ninja python3

      - name: Restore 3rdparty Dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            3rdparty/googletest
            3rdparty/pcre2
            3rdparty/llama_cpp
            3rdparty/onnxruntime
            3rdparty/nlohmann_json
            3rdparty/stb_image
          key: 3rdparty-release-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-${{ hashFiles('cmake_ext/*.cmake') }}
          restore-keys: |
            3rdparty-release-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-

      # 先回退到本作业的 main 快照，再回退到默认门禁那份配置不同的缓存。
      - name: Restore CCache
        uses: ./.github/actions/ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-real-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-real-${{ runner.os }}-${{ github.ref }}-
            ccache-real-${{ runner.os }}-
            ccache-${{ runner.os }}-

      - name: Cache Pinned GGUF
        uses: actions/cache@v4
        with:
          path: configs/qwen2.5-0.5b-instruct-q4_k_m.gguf
          key: qwen2.5-0.5b-q4-k-m-configs-v1-74a4da8c9fdb

      - name: Run Real Model and Public Profile
        run: |
          ccache -z
          LLM_EDGEFLOW_LINKER=mold \
          CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ./scripts/run_real_model_e2e.sh
          ccache -s

      - name: Save CCache
        uses: ./.github/actions/ccache-save
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-real-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          prefix: ccache-real-${{ runner.os }}-${{ github.ref }}-

  whisper-asr:
    name: Whisper ASR Backend & Real Profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write 允许 ccache-save 清理本 ref 已被取代的快照。
    permissions:
      contents: read
      actions: write

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "1G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          packages: build-essential ccache cmake curl mold ninja-build:ninja python3

      - name: Restore/Save Whisper 3rdparty Dependencies
        uses: actions/cache@v4
        with:
          path: |
            3rdparty/googletest
            3rdparty/pcre2
            3rdparty/llama_cpp
            3rdparty/whisper_cpp
            3rdparty/nlohmann_json
            3rdparty/stb_image
          key: 3rdparty-whisper-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-${{ hashFiles('cmake_ext/*.cmake') }}
          restore-keys: |
            3rdparty-whisper-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-
            3rdparty-release-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-

      - name: Restore CCache
        uses: ./.github/actions/ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-whisper-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-whisper-${{ runner.os }}-${{ github.ref }}-
            ccache-whisper-${{ runner.os }}-
            ccache-${{ runner.os }}-

      - name: Cache Pinned Whisper Model
        uses: actions/cache@v4
        with:
          path: configs/ggml-base.bin
          key: whisper-e2e-configs-v1-${{ hashFiles('configs/asset_manifest.json') }}
          restore-keys: |
            whisper-e2e-configs-v1-

      - name: Run Real Whisper E2E and Public Profile
        run: |
          ccache -z
          LLM_EDGEFLOW_LINKER=mold \
          CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ./scripts/run_real_model_e2e.sh --whisper
          ccache -s

      - name: Save CCache
        uses: ./.github/actions/ccache-save
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-whisper-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          prefix: ccache-whisper-${{ runner.os }}-${{ github.ref }}-

  kite-llm:
    name: kiteLLM Private Release & Real GGUF
    # Fork PR 和 Dependabot 拿不到仓库 secrets。本作业只在可信事件上运行，
    # 不要改为 pull_request_target。
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # actions: write 允许 ccache-save 清理本 ref 已被取代的快照。
    permissions:
      contents: read
      actions: write

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-kite
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "1G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          packages: build-essential ccache cmake curl gh libgomp1 mold ninja-build:ninja python3

      - name: Restore/Save Open-Source 3rdparty Dependencies
        uses: actions/cache@v4
        with:
          path: |
            3rdparty/googletest
            3rdparty/pcre2
            3rdparty/onnxruntime
            3rdparty/nlohmann_json
            3rdparty/stb_image
          key: 3rdparty-kite-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-${{ hashFiles('cmake_ext/*.cmake') }}
          restore-keys: |
            3rdparty-kite-v1-${{ runner.os }}-${{ env.TOOLCHAIN_ID }}-

      - name: Restore Kite CCache
        uses: ./.github/actions/ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kite-ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            kite-ccache-${{ runner.os }}-${{ github.ref }}-
            kite-ccache-${{ runner.os }}-

      # 只缓存公开的模型文件。私有 kiteLLM 头文件、库和链接后的可执行文件
      # 不得进入本公开仓库的缓存或制品。
      - name: Cache Pinned Kite Demo Models
        uses: actions/cache@v4
        with:
          path: |
            configs/qwen2.5-0.5b-instruct-q4_k_m.gguf
            configs/SmolVLM-256M-Instruct-Q8_0.gguf
            configs/mmproj-SmolVLM-256M-Instruct-Q8_0.gguf
            configs/bge_base_zh_v1.5.onnx
            configs/bge_base_zh_v1.5_vocab.txt
            configs/ms_marco_tinybert_l2_v2_quantized.onnx
            configs/ms_marco_bert_vocab.txt
          key: kite-demo-models-configs-v1-${{ hashFiles('scripts/fetch_real_test_models.sh') }}

      - name: Fetch and Verify Pinned Text and Vision Models
        run: ./scripts/fetch_real_test_models.sh --kite

      - name: Download Verified Private Release and Configure kiteLLM
        env:
          GH_TOKEN: ${{ secrets.KITELLM_GITHUB_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Set KITELLM_GITHUB_TOKEN with read access to chamsechan/kiteLLM."
            exit 1
          fi
          cmake --preset=kite-cpu \
            -DLLM_EDGEFLOW_LINKER=mold \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build kiteLLM SDK and Tests
        run: |
          ccache -z
          cmake --build build/variants/kite-cpu -j4
          ccache -s

      - name: Verify Backend Registration and Real Model Tests
        env:
          LLM_EDGEFLOW_TEST_KITELLM_DEMOS: "1"
          LLM_EDGEFLOW_TEST_KITELLM_VISION_MODEL: ${{ github.workspace }}/configs/SmolVLM-256M-Instruct-Q8_0.gguf
          LLM_EDGEFLOW_TEST_KITELLM_VISION_CONFIG: kite_vision_run.json
          LLM_EDGEFLOW_TEST_KITELLM_MODEL: ${{ github.workspace }}/configs/qwen2.5-0.5b-instruct-q4_k_m.gguf
        run: |
          test -s "${LLM_EDGEFLOW_TEST_KITELLM_MODEL}"
          ./build/variants/kite-cpu/alg_pipeline_tool catalog > build/variants/kite-cpu/catalog.json
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          with open("build/variants/kite-cpu/catalog.json", encoding="utf-8") as stream:
              catalog = json.load(stream)
          backends = {entry["backend_type"] for entry in catalog["backends"]}
          assert "kite_llm" in backends, "kiteLLM must be registered"
          assert "llama_cpp" not in backends, "Conflicting llama.cpp backend is enabled"
          kite = next(b for b in catalog["backends"] if b["backend_type"] == "kite_llm")
          assert "image_text_generation" in kite["supported_protocols"]
          assert "generated_token_embedding" in kite["supported_protocols"]
          assert any(m["impl_name"] == "generated_text_embedding" and m["model_type"] == "embedding" for m in catalog["models"])
          assert any(m["impl_name"] == "vision_document" and m["model_type"] == "ocr" for m in catalog["models"])
          configs = list(pathlib.Path("configs").glob("pipeline_*_kite*.json"))
          assert configs, "Kite deployment configurations are missing"
          for config in configs:
              for command in ("validate", "plan"):
                  subprocess.run(["./build/variants/kite-cpu/alg_pipeline_tool", command, str(config)], check=True)
          PY
          (cd build/variants/kite-cpu && ctest -j4 \
            --output-on-failure --no-tests=error \
            -L "kite")

      - name: Save Kite CCache
        uses: ./.github/actions/ccache-save
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kite-ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          prefix: kite-ccache-${{ runner.os }}-${{ github.ref }}-

  acceptance-evidence:
    name: Exact-SHA Acceptance Evidence
    if: always()
    needs: [build-and-test, sanitizer, real-c-abi-and-profile, whisper-asr, kite-llm]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Project Quality Evidence
        env:
          WHISPER_GATE_RESULT: ${{ needs.whisper-asr.result }}
          KITELLM_GATE_RESULT: ${{ needs.kite-llm.result }}
        run: |
          git fetch origin main --quiet
          ./scripts/generate_acceptance_evidence.sh \
            build/acceptance/project-quality-gate.json \
            "${{ needs.build-and-test.result }}" \
            "${{ needs.sanitizer.result }}" \
            "${{ needs.real-c-abi-and-profile.result }}" \
            project-quality-gate

      - name: Upload Project Quality Evidence
        uses: actions/upload-artifact@v4
        with:
          name: project-quality-acceptance-${{ github.sha }}
          path: build/acceptance/project-quality-gate.json

      - name: Enforce Required Job Results
        if: >-
          needs.build-and-test.result != 'success' ||
          needs.sanitizer.result != 'success' ||
          needs.real-c-abi-and-profile.result != 'success' ||
          needs.whisper-asr.result != 'success' ||
          (needs.kite-llm.result != 'success' && needs.kite-llm.result != 'skipped')
        run: exit 1
