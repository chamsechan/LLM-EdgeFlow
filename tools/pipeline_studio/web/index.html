<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LLM-EdgeFlow 算法方案工作台</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <div class="brand"><span>EF</span><div>算法方案工作台<small>Pipeline Studio · v2.5</small></div></div>
      <div class="toolbar">
        <select id="pipelineSelect" title="方案列表"></select>
        <button id="openButton">打开</button>
        <select id="bizSelect" title="业务契约"></select>
        <select id="cloneProfile" title="从 Profile 克隆"><option value="">空图</option></select>
        <button id="newButton">新建</button>
        <button id="saveButton" class="primary">保存</button>
        <button id="saveAsButton">另存</button>
        <button id="layoutButton">自动布局</button>
        <span id="dirtyBadge" class="badge">未打开</span>
      </div>
    </header>

    <main>
      <aside class="operators panel">
        <div class="panel-title">算子区</div>
        <input id="operatorSearch" placeholder="搜索实时 Catalog">
        <div id="operatorList" class="scroll"></div>
      </aside>

      <section class="canvas-panel">
        <div class="canvas-tools">
          <span id="documentTitle">请选择或新建方案</span>
          <span>拖动节点 · 从右侧圆点拉到左侧圆点 · 点击连线删除 · 滚轮缩放</span>
        </div>
        <svg id="graph" tabindex="0" aria-label="Pipeline DAG 画布">
          <defs>
            <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z"></path>
            </marker>
          </defs>
          <g id="viewport"><g id="edges"></g><g id="nodes"></g><path id="draftEdge"></path></g>
        </svg>
      </section>

      <aside class="inspector panel">
        <div class="tabs">
          <button data-tab="properties" class="active">属性</button>
          <button data-tab="json">原始 JSON</button>
          <button data-tab="validation">校验</button>
          <button data-tab="run">运行</button>
        </div>
        <section id="propertiesTab" class="tab scroll">
          <div id="emptyInspector" class="empty">选择画布节点后编辑属性</div>
          <form id="nodeForm" hidden>
            <label>节点 ID<input id="nodeId"></label>
            <div id="nodeType" class="node-type"></div>
            <div id="configFields"></div>
            <label>复杂配置 / 完整 config<textarea id="configJson" rows="10"></textarea></label>
            <div class="row"><button id="applyNode" type="submit" class="primary">应用</button><button id="deleteNode" type="button" class="danger">删除节点</button></div>
          </form>
        </section>
        <section id="jsonTab" class="tab scroll" hidden>
          <textarea id="rawJson" class="code" spellcheck="false"></textarea>
          <button id="applyJson" class="primary full">应用 JSON</button>
        </section>
        <section id="validationTab" class="tab scroll" hidden>
          <button id="validateButton" class="primary full">使用 C++ Validator 校验</button>
          <div id="validationOutput"></div>
        </section>
        <section id="runTab" class="tab scroll" hidden>
          <label>Profile<select id="runProfile"></select></label>
          <div class="row"><button id="runButton" class="primary">运行草稿</button><button id="cancelButton" class="danger" disabled>取消</button></div>
          <pre id="runLog" class="log">尚未运行</pre>
          <pre id="runResult" class="result"></pre>
        </section>
      </aside>
    </main>
    <div id="toast" role="status"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
