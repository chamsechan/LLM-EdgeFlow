<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Card Surface Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .code-text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: #94A3B8; }
      
      /* Animation Keyframes */
      @keyframes pulse-cyan {
        0%, 100% { stroke: #06B6D4; stroke-width: 1.5; filter: drop-shadow(0 0 2px #06B6D4); }
        50% { stroke: #38BDF8; stroke-width: 2.5; filter: drop-shadow(0 0 8px #38BDF8); }
      }
      @keyframes pulse-emerald {
        0%, 100% { stroke: #10B981; stroke-width: 1.5; filter: drop-shadow(0 0 2px #10B981); }
        50% { stroke: #34D399; stroke-width: 2.5; filter: drop-shadow(0 0 8px #34D399); }
      }
      @keyframes pulse-purple {
        0%, 100% { stroke: #8B5CF6; stroke-width: 1.5; filter: drop-shadow(0 0 2px #8B5CF6); }
        50% { stroke: #A78BFA; stroke-width: 2.5; filter: drop-shadow(0 0 8px #A78BFA); }
      }
      @keyframes flow-line {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes packet-move-1 {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(180px); opacity: 0; }
      }
      @keyframes packet-move-2 {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(200px); opacity: 0; }
      }
      @keyframes packet-move-3 {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(190px); opacity: 0; }
      }
      @keyframes badge-blink {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      
      .animated-flow { stroke-dasharray: 6 4; animation: flow-line 1.2s linear infinite; }
      .flow-cyan { stroke: #06B6D4; }
      .flow-emerald { stroke: #10B981; }
      .flow-purple { stroke: #8B5CF6; }
      .flow-amber { stroke: #F59E0B; }
      
      .node-cyan { animation: pulse-cyan 3s ease-in-out infinite; }
      .node-emerald { animation: pulse-emerald 3.5s ease-in-out infinite; }
      .node-purple { animation: pulse-purple 4s ease-in-out infinite; }
      .pulse-badge { animation: badge-blink 2s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="520" rx="14" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <g transform="translate(30, 24)">
    <text x="0" y="20" class="title-text" font-size="18" fill="url(#header-grad)">LLM-EdgeFlow</text>
    <text x="135" y="20" class="title-text" font-size="13" fill="#64748B">|</text>
    <text x="150" y="19" class="title-text" font-size="13" fill="#94A3B8">High-Performance C++ Pipeline &amp; Heterogeneous Inference Architecture</text>
    
    <!-- Badges in Header -->
    <g transform="translate(680, 4)">
      <rect width="70" height="20" rx="10" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1"/>
      <text x="35" y="14" text-anchor="middle" class="code-text" font-size="10" font-weight="600" fill="#38BDF8">C++17</text>
    </g>
    <g transform="translate(760, 4)">
      <rect width="80" height="20" rx="10" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
      <text x="40" y="14" text-anchor="middle" class="code-text" font-size="10" font-weight="600" fill="#34D399">Pure C ABI</text>
    </g>
    <g transform="translate(850, 4)">
      <rect width="50" height="20" rx="10" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
      <text x="25" y="14" text-anchor="middle" class="code-text" font-size="10" font-weight="600" fill="#A78BFA">GTest</text>
    </g>
  </g>

  <!-- 4 Main Layer Columns -->

  <!-- ========================================================================= -->
  <!-- COLUMN 1: Layer 1 - Standard C ABI Export (Host/Downstream) -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 65)">
    <!-- Column Background Box -->
    <rect width="190" height="425" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Column Header -->
    <path d="M 0 10 Q 0 0 10 0 L 180 0 Q 190 0 190 10 L 190 32 L 0 32 Z" fill="#1E293B"/>
    <text x="12" y="21" class="title-text" font-size="12" fill="#38BDF8">Layer 1: C ABI 适配与安全屏障</text>
    
    <!-- Item: C ABI Exports -->
    <g transform="translate(10, 44)">
      <rect width="170" height="110" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
      <text x="10" y="18" class="code-text" font-size="11" font-weight="600" fill="#E2E8F0">Export C ABI (6 APIs)</text>
      <line x1="10" y1="26" x2="160" y2="26" stroke="#334155" stroke-width="1"/>
      <text x="10" y="42" class="code-text" font-size="9.5" fill="#38BDF8">▶ Alg_Init() / DeInit()</text>
      <text x="10" y="58" class="code-text" font-size="9.5" fill="#38BDF8">▶ Alg_Create() / Destroy()</text>
      <text x="10" y="74" class="code-text" font-size="9.5" fill="#38BDF8">▶ Alg_Process(in, out)</text>
      <text x="10" y="90" class="code-text" font-size="9.5" fill="#38BDF8">▶ Alg_Control(cmd, json)</text>
      <rect x="10" y="98" width="150" height="2" rx="1" fill="#0284C7" opacity="0.6"/>
    </g>

    <!-- Item: Multi-Modal In/Out Structs -->
    <g transform="translate(10, 166)">
      <rect width="170" height="150" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="10" y="18" class="title-text" font-size="11" fill="#94A3B8">多模态异构输入结构体</text>
      <line x1="10" y1="26" x2="160" y2="26" stroke="#334155" stroke-width="1"/>
      
      <g transform="translate(8, 34)">
        <circle cx="5" cy="6" r="3" fill="#F59E0B"/>
        <text x="14" y="9" class="code-text" font-size="9.5" fill="#FDE68A">CompanyDocInput</text>
      </g>
      <g transform="translate(8, 56)">
        <circle cx="5" cy="6" r="3" fill="#10B981"/>
        <text x="14" y="9" class="code-text" font-size="9.5" fill="#A7F3D0">CompanyOcrDocInput</text>
      </g>
      <g transform="translate(8, 78)">
        <circle cx="5" cy="6" r="3" fill="#8B5CF6"/>
        <text x="14" y="9" class="code-text" font-size="9.5" fill="#DDD6FE">CompanyAudioInput</text>
      </g>
      <g transform="translate(8, 100)">
        <circle cx="5" cy="6" r="3" fill="#06B6D4"/>
        <text x="14" y="9" class="code-text" font-size="9.5" fill="#BAE6FD">CompanyRerankBatch</text>
      </g>
      <g transform="translate(8, 122)">
        <circle cx="5" cy="6" r="3" fill="#EC4899"/>
        <text x="14" y="9" class="code-text" font-size="9.5" fill="#FBCFE8">CompanyAuditInput</text>
      </g>
    </g>

    <!-- Item: Exception Barrier Shield -->
    <g transform="translate(10, 328)">
      <rect width="170" height="85" rx="6" fill="#0369A1" fill-opacity="0.15" stroke="#0284C7" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <path d="M 0 0 L 14 0 L 14 10 Q 14 16 7 19 Q 0 16 0 10 Z" fill="#0284C7"/>
        <text x="20" y="14" class="title-text" font-size="11" font-weight="700" fill="#38BDF8">noexcept 异常安全屏障</text>
      </g>
      <text x="12" y="48" class="label-text" fill="#94A3B8">拦截内部所有 C++ 异常</text>
      <text x="12" y="66" class="label-text" fill="#34D399">✓ 杜绝下游宿主进程崩溃</text>
    </g>
  </g>

  <!-- Connection Line 1 -> 2 with Animated Pulse -->
  <path d="M 220 180 L 255 180" fill="none" class="animated-flow flow-cyan" stroke-width="2"/>
  <path d="M 220 370 L 255 370" fill="none" class="animated-flow flow-emerald" stroke-width="2"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: Layer 2 - Pipeline Orchestration & Dynamic Blackboard -->
  <!-- ========================================================================= -->
  <g transform="translate(255, 65)">
    <rect width="210" height="425" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    
    <path d="M 0 10 Q 0 0 10 0 L 200 0 Q 210 0 210 10 L 210 32 L 0 32 Z" fill="#1E293B"/>
    <text x="12" y="21" class="title-text" font-size="12" fill="#34D399">Layer 2: 管线调度与动态黑板</text>

    <!-- Pipeline Orchestrator -->
    <g transform="translate(10, 44)">
      <rect width="190" height="95" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" class="node-emerald"/>
      <text x="12" y="20" class="code-text" font-size="11" font-weight="600" fill="#34D399">Pipeline (DAG 引擎)</text>
      <text x="12" y="40" class="label-text">▶ BuildFromConfigFile(json)</text>
      <text x="12" y="58" class="label-text">▶ Execute(&amp;req_ctx)</text>
      <text x="12" y="76" class="label-text">▶ Control(cmd, json_param)</text>
    </g>

    <!-- Dynamic Blackboard: AlgContext -->
    <g transform="translate(10, 150)">
      <rect width="190" height="150" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1"/>
      <text x="12" y="20" class="code-text" font-size="11" font-weight="600" fill="#A7F3D0">AlgContext (请求级黑板)</text>
      <line x1="12" y1="28" x2="178" y2="28" stroke="#334155" stroke-width="1"/>
      
      <rect x="12" y="38" width="166" height="22" rx="4" fill="#1E293B"/>
      <text x="18" y="53" class="code-text" font-size="9" fill="#38BDF8">Set&lt;T&gt;(key, val)</text>
      
      <rect x="12" y="66" width="166" height="22" rx="4" fill="#1E293B"/>
      <text x="18" y="81" class="code-text" font-size="9" fill="#34D399">Get&lt;T&gt;(key) ➔ Type-Safe</text>

      <rect x="12" y="94" width="166" height="22" rx="4" fill="#1E293B"/>
      <text x="18" y="109" class="code-text" font-size="9" fill="#FBBF24">SetError(code, msg)</text>

      <text x="12" y="136" class="label-text" font-size="10" fill="#94A3B8">动态类型擦除 · 自动析构回收</text>
    </g>

    <!-- SessionContext & ModelManager -->
    <g transform="translate(10, 312)">
      <rect width="190" height="100" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" class="code-text" font-size="11" font-weight="600" fill="#E2E8F0">SessionContext</text>
      <line x1="12" y1="28" x2="178" y2="28" stroke="#334155" stroke-width="1"/>
      <text x="12" y="48" class="code-text" font-size="9.5" fill="#C084FC">ModelManager (模型池)</text>
      <text x="12" y="66" class="label-text">▶ RegisterModel(id, engine)</text>
      <text x="12" y="84" class="label-text">▶ GetModel&lt;IEngine&gt;(id)</text>
    </g>
  </g>

  <!-- Connection Line 2 -> 3 with Animated Pulse -->
  <path d="M 465 180 L 500 180" fill="none" class="animated-flow flow-emerald" stroke-width="2"/>
  <path d="M 465 360 L 500 360" fill="none" class="animated-flow flow-purple" stroke-width="2"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: Layer 3 - Pluggable Business Node Pool -->
  <!-- ========================================================================= -->
  <g transform="translate(500, 65)">
    <rect width="200" height="425" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    
    <path d="M 0 10 Q 0 0 10 0 L 190 0 Q 200 0 200 10 L 200 32 L 0 32 Z" fill="#1E293B"/>
    <text x="12" y="21" class="title-text" font-size="12" fill="#FBBF24">Layer 3: 业务专属算子池</text>

    <!-- Node 1: PreProcess & Rule -->
    <g transform="translate(10, 44)">
      <rect width="180" height="60" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
      <text x="10" y="18" class="code-text" font-size="10.5" font-weight="600" fill="#FBBF24">1. 前处理 / 规则快筛</text>
      <text x="10" y="36" class="label-text">DocChunk / SafetyRule</text>
      <text x="10" y="50" class="label-text" fill="#64748B">AudioFeature / ImagePre</text>
    </g>

    <!-- Node 2: Dense Embedding & OCR -->
    <g transform="translate(10, 114)">
      <rect width="180" height="60" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
      <text x="10" y="18" class="code-text" font-size="10.5" font-weight="600" fill="#38BDF8">2. 表征与感知算子</text>
      <text x="10" y="36" class="label-text">DocEmbeddingNode (IEmbed)</text>
      <text x="10" y="50" class="label-text" fill="#64748B">OcrInferNode / AsrInferNode</text>
    </g>

    <!-- Node 3: Cross Rerank & Search -->
    <g transform="translate(10, 184)">
      <rect width="180" height="60" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
      <text x="10" y="18" class="code-text" font-size="10.5" font-weight="600" fill="#C084FC">3. 检索与精排打分</text>
      <text x="10" y="36" class="label-text">VectorSearchNode (余弦TopK)</text>
      <text x="10" y="50" class="label-text" fill="#64748B">CrossRerankNode (IRerank)</text>
    </g>

    <!-- Node 4: LLM Generation -->
    <g transform="translate(10, 254)">
      <rect width="180" height="60" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" class="node-emerald"/>
      <text x="10" y="18" class="code-text" font-size="10.5" font-weight="600" fill="#34D399">4. 大模型生成算子</text>
      <text x="10" y="36" class="label-text">LlmGenerateNode (ILlm)</text>
      <text x="10" y="50" class="label-text" fill="#64748B">LlmAuditNode / RiskPrompt</text>
    </g>

    <!-- Node 5: PostProcess -->
    <g transform="translate(10, 324)">
      <rect width="180" height="85" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="10" y="18" class="code-text" font-size="10.5" font-weight="600" fill="#CBD5E1">5. 后处理与对齐打包</text>
      <text x="10" y="36" class="label-text">DocQaPost / AuditPost</text>
      <text x="10" y="50" class="label-text">OcrDocPost / RerankSortPost</text>
      <text x="10" y="70" class="label-text" fill="#10B981">✓ (req_id, sub_id) 精准对齐</text>
    </g>
  </g>

  <!-- Connection Line 3 -> 4 with Animated Pulse -->
  <path d="M 700 144 L 735 144" fill="none" class="animated-flow flow-cyan" stroke-width="2"/>
  <path d="M 700 214 L 735 214" fill="none" class="animated-flow flow-purple" stroke-width="2"/>
  <path d="M 700 284 L 735 284" fill="none" class="animated-flow flow-emerald" stroke-width="2"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 4: Layer 4 - Engines & Hardware Batching -->
  <!-- ========================================================================= -->
  <g transform="translate(735, 65)">
    <rect width="195" height="425" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    
    <path d="M 0 10 Q 0 0 10 0 L 185 0 Q 195 0 195 10 L 195 32 L 0 32 Z" fill="#1E293B"/>
    <text x="12" y="21" class="title-text" font-size="12" fill="#C084FC">Layer 4: 异构引擎与分批调度</text>

    <!-- FixedBatchExecutor -->
    <g transform="translate(10, 44)">
      <rect width="175" height="95" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1" class="node-purple"/>
      <text x="8" y="18" class="code-text" font-size="10.5" font-weight="600" fill="#A78BFA">FixedBatchExecutor</text>
      <text x="8" y="34" class="code-text" font-size="9" fill="#94A3B8">Execute&lt;TIn, TOut&gt; 泛型模板</text>
      <line x1="8" y1="40" x2="167" y2="40" stroke="#334155" stroke-width="1"/>
      <text x="8" y="56" class="label-text" fill="#38BDF8">▶ 自动定长切块 (Batch=4/2)</text>
      <text x="8" y="72" class="label-text" fill="#F59E0B">▶ Dummy Pad 自动补齐与剥离</text>
      <text x="8" y="88" class="label-text" fill="#10B981">▶ TraceableItem 样本溯源</text>
    </g>

    <!-- Backend 1: ONNX Runtime -->
    <g transform="translate(10, 150)">
      <rect width="175" height="75" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
      <g transform="translate(8, 16)">
        <rect width="8" height="8" rx="2" fill="#0284C7"/>
        <text x="14" y="8" class="code-text" font-size="10.5" font-weight="600" fill="#38BDF8">ONNX Runtime</text>
      </g>
      <text x="8" y="44" class="label-text">OnnxEmbeddingEngine</text>
      <text x="8" y="60" class="label-text">OnnxRerankEngine</text>
    </g>

    <!-- Backend 2: llama.cpp -->
    <g transform="translate(10, 235)">
      <rect width="175" height="75" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <g transform="translate(8, 16)">
        <rect width="8" height="8" rx="2" fill="#10B981"/>
        <text x="14" y="8" class="code-text" font-size="10.5" font-weight="600" fill="#34D399">llama.cpp (ggml)</text>
      </g>
      <text x="8" y="44" class="label-text">LlamaCppEngine (GGUF)</text>
      <text x="8" y="60" class="label-text" fill="#94A3B8">Qwen / Gemma / DeepSeek</text>
    </g>

    <!-- Backend 3: Hardware NPU DMA -->
    <g transform="translate(10, 320)">
      <rect width="175" height="90" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
      <g transform="translate(8, 16)">
        <rect width="8" height="8" rx="2" fill="#F59E0B"/>
        <text x="14" y="8" class="code-text" font-size="10.5" font-weight="600" fill="#FBBF24">Hardware NPU / DMA</text>
      </g>
      <text x="8" y="42" class="label-text">Ascend / RKNN / Horizon</text>
      <text x="8" y="58" class="label-text">MockNpuEmbedding / LLM</text>
      <text x="8" y="74" class="label-text">MockNpuOcr / MockNpuAsr</text>
    </g>
  </g>

  <!-- Bottom Global Status Footer -->
  <g transform="translate(30, 498)">
    <circle cx="6" cy="6" r="4" fill="#10B981" class="pulse-badge"/>
    <text x="16" y="10" class="code-text" font-size="10.5" fill="#94A3B8">System Status: Fully Verified · 100% GTest Passed · 7 Multi-Modal Businesses Ready · Zero External Dependency</text>
  </g>
</svg>
