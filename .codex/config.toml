# 仅供 Codex 使用的运行时与模型映射。
# 共享角色与委派上下文策略统一定义在 ../AGENTS.md。
# 本文件须兼容 Codex CLI 0.144.0-alpha.4 的严格配置校验。

[features]
multi_agent = true

[agents]
max_threads = 4

[agents.scout]
description = "Read-only discovery and impact analysis for unfamiliar scope."
config_file = "./agents/scout.toml"

[agents.mechanical_worker]
description = "Bounded mechanical edits after design decisions are settled."
config_file = "./agents/mechanical_worker.toml"

[agents.test_author]
description = "Independent focused behavior and public-contract tests."
config_file = "./agents/test_author.toml"

[agents.verifier]
description = "Diagnostic checks and the canonical delivery gate; no source fixes."
config_file = "./agents/verifier.toml"

[agents.reviewer]
description = "Read-only independent review of high-risk changes."
config_file = "./agents/reviewer.toml"
